<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="780" viewBox="0 0 1150 780" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Execution Unit Architecture</title>
  <desc>Port-level block diagram of the execution_unit top module. Module port names are shown inside each block; signal names are shown on the wires.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- legend -->
  <text x="130" y="50" font-size="11" fill="#888">Inside blocks: module port names   ·   On wires: signal names</text>

  <!-- execution_unit boundary -->
  <rect x="110" y="70" width="1015" height="630" rx="12" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="1112" y="688" text-anchor="end" font-size="12" fill="#777">execution_unit (top module)</text>

  <!-- ===================== Instruction decoder ===================== -->
  <rect x="570" y="100" width="340" height="100" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5"/>
  <text x="740" y="143" dy=".35em" text-anchor="middle" font-size="15" font-weight="bold" fill="#3C3489">Instruction decoder</text>
  <text x="740" y="165" dy=".35em" text-anchor="middle" font-size="12" fill="#534AB7">instruction_decoder (decoder)</text>
  <text x="740" y="113" dy=".35em" text-anchor="middle" font-size="11" fill="#534AB7">instruction</text>
  <text x="578" y="150" dy=".35em" text-anchor="start" font-size="11" fill="#534AB7">rd</text>
  <text x="902" y="150" dy=".35em" text-anchor="end" font-size="11" fill="#534AB7">opcode</text>
  <text x="660" y="188" dy=".35em" text-anchor="middle" font-size="11" fill="#534AB7">rs1</text>
  <text x="820" y="188" dy=".35em" text-anchor="middle" font-size="11" fill="#534AB7">rs2</text>

  <!-- instruction input -->
  <text x="740" y="26" text-anchor="middle" font-size="12" fill="#777">instruction[31:0]</text>
  <line x1="740" y1="36" x2="740" y2="100" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- rs1 / rs2 : decoder -> register file read addresses -->
  <line x1="660" y1="200" x2="660" y2="290" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="820" y1="200" x2="820" y2="290" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="652" y="245" dy=".35em" text-anchor="end" font-size="12" fill="#777">rs1[4:0]</text>
  <text x="828" y="245" dy=".35em" text-anchor="start" font-size="12" fill="#777">rs2[4:0]</text>

  <!-- rd : decoder -> write-back select -->
  <path d="M570 150 H260 V290" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="415" y="141" text-anchor="middle" font-size="12" fill="#777">rd[4:0]</text>

  <!-- opcode : decoder -> ALU alu_op -->
  <path d="M910 150 H1030 V590 H910" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1038" y="300" font-size="12" fill="#777">opcode[3:0]</text>
  <text x="1038" y="317" font-size="12" fill="#777">(to alu_op)</text>

  <!-- clk / rst : external -> register file (hop over the opcode wire) -->
  <text x="950" y="26" text-anchor="middle" font-size="12" fill="#777">clk</text>
  <text x="978" y="26" text-anchor="middle" font-size="12" fill="#777">rst</text>
  <path d="M950 36 V135 A15 15 0 0 1 950 165 V350 H910" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M978 36 V135 A15 15 0 0 1 978 165 V390 H910" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===================== Register file ===================== -->
  <rect x="570" y="290" width="340" height="160" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="740" y="340" dy=".35em" text-anchor="middle" font-size="15" font-weight="bold" fill="#085041">Register file — 32 × 32</text>
  <text x="740" y="362" dy=".35em" text-anchor="middle" font-size="12" fill="#0F6E56">register_file (rf) · version 2</text>
  <text x="740" y="383" dy=".35em" text-anchor="middle" font-size="12" fill="#0F6E56">sync write · async read · sync reset</text>
  <text x="660" y="303" dy=".35em" text-anchor="middle" font-size="11" fill="#0F6E56">read_addr1</text>
  <text x="820" y="303" dy=".35em" text-anchor="middle" font-size="11" fill="#0F6E56">read_addr2</text>
  <text x="578" y="335" dy=".35em" text-anchor="start" font-size="11" fill="#0F6E56">write_addr</text>
  <text x="578" y="365" dy=".35em" text-anchor="start" font-size="11" fill="#0F6E56">write_data</text>
  <text x="578" y="395" dy=".35em" text-anchor="start" font-size="11" fill="#0F6E56">reg_write</text>
  <text x="902" y="350" dy=".35em" text-anchor="end" font-size="11" fill="#0F6E56">clk</text>
  <text x="902" y="390" dy=".35em" text-anchor="end" font-size="11" fill="#0F6E56">rst</text>
  <text x="660" y="437" dy=".35em" text-anchor="middle" font-size="11" fill="#0F6E56">read_data1</text>
  <text x="820" y="437" dy=".35em" text-anchor="middle" font-size="11" fill="#0F6E56">read_data2</text>

  <!-- operand_a / operand_b : register file -> ALU -->
  <line x1="660" y1="450" x2="660" y2="540" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="820" y1="450" x2="820" y2="540" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="652" y="495" dy=".35em" text-anchor="end" font-size="12" fill="#777">operand_a[31:0]</text>
  <text x="828" y="495" dy=".35em" text-anchor="start" font-size="12" fill="#777">operand_b[31:0]</text>

  <!-- ===================== ALU ===================== -->
  <rect x="570" y="540" width="340" height="100" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/>
  <text x="740" y="585" dy=".35em" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A1B0C">ALU — 32-bit</text>
  <text x="740" y="607" dy=".35em" text-anchor="middle" font-size="12" fill="#993C1D">alu (alu_core)</text>
  <text x="660" y="553" dy=".35em" text-anchor="middle" font-size="11" fill="#993C1D">operand_a</text>
  <text x="820" y="553" dy=".35em" text-anchor="middle" font-size="11" fill="#993C1D">operand_b</text>
  <text x="902" y="590" dy=".35em" text-anchor="end" font-size="11" fill="#993C1D">alu_op</text>
  <text x="660" y="628" dy=".35em" text-anchor="middle" font-size="11" fill="#993C1D">result</text>
  <text x="820" y="628" dy=".35em" text-anchor="middle" font-size="11" fill="#993C1D">zero</text>

  <!-- ALU result: top-level output and feedback to write-back select -->
  <line x1="660" y1="640" x2="660" y2="740" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="660" cy="675" r="3.5" fill="#888"/>
  <path d="M660 675 H260 V450" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="662" text-anchor="middle" font-size="12" fill="#777">alu_result[31:0]</text>
  <text x="660" y="762" text-anchor="middle" font-size="12" fill="#777">alu_result[31:0]</text>

  <!-- ALU zero: top-level output -->
  <line x1="820" y1="640" x2="820" y2="740" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="820" y="762" text-anchor="middle" font-size="12" fill="#777">zero</text>

  <!-- ===================== Write-back / init select ===================== -->
  <rect x="150" y="290" width="300" height="160" rx="8" fill="#fff8e1" stroke="#f0a500" stroke-width="1.5"/>
  <text x="300" y="312" dy=".35em" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5000">Write-back / init select</text>
  <text x="300" y="335" dy=".35em" text-anchor="middle" font-size="10.5" fill="#8a6200">write_addr = init_write ? init_addr : rd</text>
  <text x="300" y="365" dy=".35em" text-anchor="middle" font-size="10.5" fill="#8a6200">write_data = init_write ? init_data : alu_result</text>
  <text x="300" y="395" dy=".35em" text-anchor="middle" font-size="10.5" fill="#8a6200">rf_write_enable = init_write | reg_write</text>
  <text x="300" y="428" dy=".35em" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8a6200">init path: simulation / verification</text>

  <!-- external inputs to write-back select -->
  <text x="8" y="324" font-size="12" fill="#777">init_write</text>
  <line x1="8" y1="330" x2="150" y2="330" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="8" y="354" font-size="12" fill="#777">init_addr[4:0]</text>
  <line x1="8" y1="360" x2="150" y2="360" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="8" y="384" font-size="12" fill="#777">init_data[31:0]</text>
  <line x1="8" y1="390" x2="150" y2="390" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="8" y="414" font-size="12" fill="#777">reg_write</text>
  <line x1="8" y1="420" x2="150" y2="420" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- write port : write-back select -> register file (one wire per signal) -->
  <line x1="450" y1="335" x2="570" y2="335" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="510" y="327" text-anchor="middle" font-size="12" fill="#777">write_addr[4:0]</text>
  <line x1="450" y1="365" x2="570" y2="365" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="510" y="357" text-anchor="middle" font-size="12" fill="#777">write_data[31:0]</text>
  <line x1="450" y1="395" x2="570" y2="395" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="510" y="387" text-anchor="middle" font-size="12" fill="#777">rf_write_enable</text>
</svg>
