<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 32-bit Instruction -->
  <rect x="240" y="20" width="200" height="44" rx="8" fill="#e8e6f8" stroke="#7F77DD" stroke-width="1"/>
  <text x="340" y="47" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489" font-family="sans-serif">32-bit instruction</text>

  <!-- Arrow down -->
  <line x1="340" y1="64" x2="340" y2="104" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Instruction Decoder -->
  <rect x="190" y="104" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="340" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489" font-family="sans-serif">Instruction decoder</text>
  <text x="340" y="149" text-anchor="middle" font-size="12" fill="#534AB7" font-family="sans-serif">Extracts opcode · rs1 · rs2 · rd</text>

  <!-- Arrows: Decoder → RegFile -->
  <line x1="260" y1="160" x2="220" y2="220" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="210" y="197" text-anchor="middle" font-size="12" fill="#555" font-family="sans-serif">rs1</text>
  <line x1="340" y1="160" x2="340" y2="220" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="197" text-anchor="middle" font-size="12" fill="#555" font-family="sans-serif">rs2</text>
  <line x1="420" y1="160" x2="460" y2="220" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="472" y="197" text-anchor="middle" font-size="12" fill="#555" font-family="sans-serif">rd</text>

  <!-- Register File -->
  <rect x="140" y="220" width="400" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="340" y="244" text-anchor="middle" font-size="14" font-weight="600" fill="#085041" font-family="sans-serif">Register file — 32 × 32</text>
  <text x="340" y="265" text-anchor="middle" font-size="12" fill="#0F6E56" font-family="sans-serif">32 registers · 32-bit wide · dual read · single write</text>

  <!-- Arrows: RegFile → ALU -->
  <line x1="265" y1="276" x2="295" y2="340" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="314" text-anchor="middle" font-size="12" fill="#555" font-family="sans-serif">Operand A</text>
  <line x1="415" y1="276" x2="385" y2="340" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="438" y="314" text-anchor="middle" font-size="12" fill="#555" font-family="sans-serif">Operand B</text>

  <!-- ALU -->
  <rect x="240" y="340" width="200" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="340" y="364" text-anchor="middle" font-size="14" font-weight="600" fill="#4A1B0C" font-family="sans-serif">ALU — 32-bit</text>
  <text x="340" y="384" text-anchor="middle" font-size="11" fill="#993C1D" font-family="sans-serif">ADD · SUB · AND · OR · XOR · NOT · SLL · SRL · SLT · PASS</text>

  <!-- Arrow: ALU → Writeback -->
  <line x1="340" y1="396" x2="340" y2="436" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="385" y="422" text-anchor="middle" font-size="12" fill="#555" font-family="sans-serif">ALU result</text>

  <!-- Writeback -->
  <rect x="240" y="436" width="200" height="44" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="340" y="455" text-anchor="middle" font-size="14" font-weight="600" fill="#085041" font-family="sans-serif">Register file writeback</text>
  <text x="340" y="472" text-anchor="middle" font-size="12" fill="#0F6E56" font-family="sans-serif">Result → rd</text>
</svg>
